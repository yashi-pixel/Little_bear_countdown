<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fffaf4"><meta name="description" content="A cozy daily countdown with cheerful animal friends.">
<link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="manifest" href="./manifest.webmanifest">
<title>Little Bear Countdown</title>
<style>
:root{--cream:#fffaf4;--paper:#fffefd;--ink:#51443b;--muted:#a18a79;--dot:#b99a80;--done:#eee5dc;--blue:#9cb8c7}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif}
.shell{max-width:780px;min-height:100vh;margin:auto;background:var(--paper);border-inline:1px solid #f0e2d5;padding:26px 26px 34px;display:flex;flex-direction:column;align-items:center;text-align:center}
.eyebrow{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:#b49b88;margin:0 0 9px}h1{font-size:clamp(2rem,6vw,3.2rem);line-height:1.05;letter-spacing:-.04em;margin:0;font-weight:800}.subtitle{margin:9px 0 0;color:#a58d7b;font-size:1.08rem}
.stage{position:relative;width:min(100%,440px);height:285px;margin:8px auto 0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px}
.speech{position:absolute;top:8px;right:0;z-index:3;max-width:215px;padding:13px 17px;background:#f1f1f1;border:1px solid #d8d8d8;border-radius:23px 23px 8px 23px;box-shadow:0 8px 24px #6f6f6f18;font-size:1rem;font-weight:750;line-height:1.35;color:#625247}
.speech:after{content:"";position:absolute;left:22px;bottom:-8px;width:14px;height:14px;background:#f1f1f1;border-left:1px solid #d8d8d8;border-bottom:1px solid #d8d8d8;transform:rotate(-45deg)}
.mascot{width:250px;height:260px;overflow:visible;filter:drop-shadow(0 7px 0 #eadac7);animation:bounce 2.2s ease-in-out infinite;position:relative;z-index:1}
.mascot-shadow{position:absolute;bottom:8px;left:50%;width:105px;height:13px;border-radius:50%;background:rgba(75,65,58,.22);filter:blur(3px);transform:translateX(-50%);animation:shadowPulse 2.2s ease-in-out infinite;z-index:0}
.eye-sparkle{fill:#fff;stroke:none;pointer-events:none}
.head-motion{transform-box:fill-box;transform-origin:50% 70%;animation:headbob 3s ease-in-out infinite}.ear-left,.ear-right{transform-box:fill-box;transform-origin:50% 85%;animation:earwig 3.5s ease-in-out infinite}.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
@keyframes shadowPulse{0%,100%{opacity:.7;transform:translateX(-50%) scaleX(1)}50%{opacity:.35;transform:translateX(-50%) scaleX(.72)}}@keyframes bounce{0%,100%{transform:translateY(3px)}50%{transform:translateY(-8px)}}@keyframes headbob{0%,100%{rotate:-1deg}50%{rotate:1.5deg}}@keyframes earwig{0%,100%{rotate:0deg}50%{rotate:4deg}}@keyframes blink{0%,42%,47%,100%{transform:scaleY(1)}44%{transform:scaleY(.12)}}
.countdown{display:flex;align-items:baseline;justify-content:center;gap:14px;margin:0 0 10px}.days{font-size:clamp(5rem,18vw,7rem);line-height:.9;font-weight:800;letter-spacing:-.07em;color:#765f4d}.days-label{font-size:1.25rem;font-weight:700;color:#a88c76}
.progress-wrap{width:min(100%,540px);margin:8px 0 16px}.progress-head{display:flex;justify-content:space-between;gap:12px;font-size:.85rem;color:#a18a79;margin-bottom:10px}
.dots{display:grid;grid-template-columns:repeat(10,minmax(12px,1fr));gap:9px;align-items:center;justify-items:center;padding:4px 0}.dot{width:15px;height:15px;border-radius:50%;background:var(--dot);border:1px solid #a88a72;position:relative}.dot.done{background:var(--done);border-color:#d8c7b7}.dot.done:after{content:"";position:absolute;left:1px;right:1px;top:6px;height:2px;background:#8f7b69;transform:rotate(-38deg);border-radius:2px}.dot.today{outline:2px solid #8daab9;outline-offset:3px}
.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:10px}button,input{font:inherit}button{border:1px solid #dfcbbb;background:#fffaf5;color:#6f5b4b;padding:10px 15px;border-radius:999px;cursor:pointer}button:hover{background:#f8eee5}button:focus-visible{outline:3px solid #a8c5d2;outline-offset:2px}
.settings{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;color:#a18a79;font-size:.9rem;margin-top:14px}
.target-caption{min-height:1.3em;margin:-2px 0 10px;color:#9b806c;font-size:1rem;font-weight:600}
.target-rows{display:flex;flex-direction:column;gap:8px;width:100%;max-width:460px}
.target-row{display:flex;flex-wrap:wrap;gap:7px;align-items:center;justify-content:center}
.target-row input[type=text]{min-width:140px;flex:1;border:1px solid #e5d4c5;border-radius:10px;padding:8px;background:white;color:#6f5b4b}
.target-row input[type=date]{width:145px}
.target-row button{padding:7px 10px}
input[type=date]{border:1px solid #e5d4c5;border-radius:10px;padding:8px;background:white;color:#6f5b4b}.footer{margin-top:20px;font-size:.78rem;color:#b6a291}
@media(max-width:480px){.shell{padding:22px 15px 30px}.stage{height:260px;width:100%}.speech{right:0;top:3px;max-width:165px;font-size:.88rem;padding:11px 13px}.mascot{width:215px;height:235px}.dots{grid-template-columns:repeat(7,minmax(12px,1fr));gap:8px}.dot{width:12px;height:12px}.dot.done:after{top:5px}}
/* Desktop app sizing: fill the app window and fit content to its height. */
html{min-height:100%;background:var(--paper)}
body{min-height:100vh;min-height:100dvh;background:var(--paper);overflow:auto}
.shell{width:100%;max-width:none;min-height:100vh;min-height:100dvh;margin:0;border:0;padding:clamp(12px,2.5vh,26px) clamp(14px,3vw,30px) clamp(14px,2.5vh,28px)}
.stage{height:clamp(150px,32vh,285px);width:min(100%,440px);margin-top:clamp(2px,1vh,8px)}
.mascot{height:100%;width:auto;max-width:75%;}
.speech{max-width:min(215px,45%);font-size:clamp(.78rem,1.8vh,1rem);padding:clamp(8px,1.5vh,13px) clamp(10px,1.8vw,17px)}
.countdown{margin-bottom:clamp(5px,1.2vh,10px)}
.days{font-size:clamp(4rem,15vh,7rem)}
.progress-wrap{margin:clamp(4px,1vh,8px) 0 clamp(8px,1.8vh,16px)}
.controls{margin-top:clamp(4px,1.2vh,10px)}
.footer{margin-top:clamp(8px,2vh,20px)}
@media(max-height:650px){.eyebrow{margin-bottom:4px}h1{font-size:clamp(1.7rem,5vh,2.5rem)}.subtitle{margin-top:4px;font-size:.95rem}.stage{height:clamp(125px,27vh,190px)}.mascot{max-width:60%}.progress-head{margin-bottom:5px}.dot{width:12px;height:12px}.dots{gap:6px}.footer{margin-top:8px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body><main class="shell">
<p class="eyebrow">A little reminder for you</p><h1>Little Bear Countdown</h1><p class="subtitle">One day at a time. You’re getting there.</p>
<section class="stage" aria-label="Cheerful animated animal companion"><div class="speech" id="speech" aria-live="polite">You’ve got this, one little step at a time!</div><div class="mascot-shadow" aria-hidden="true"></div><svg class="mascot" id="mascot" viewBox="0 0 260 250" role="img" aria-label="A cute smiling animal head"></svg></section>
<div class="countdown"><span class="days" id="days">29</span><span class="days-label" id="daysLabel">days to go</span></div>
<div class="target-caption" id="targetCaption" aria-live="polite"></div>
<section class="progress-wrap"><div class="progress-head"><span id="progressText">You’ve made it through 0 days</span><span id="leftText">29 left</span></div><div class="dots" id="dots" aria-label="Countdown day tracker"></div></section>
<div class="controls"><button id="editDate" type="button">Change countdown date</button><button id="newLine" type="button">Hear another cheer</button></div>
<div class="settings" id="dateSettings" hidden>
  <div id="targetRows" class="target-rows"></div>
  <button id="addTarget" type="button">+ Add another date</button>
  <button id="saveDate" type="button">Save dates</button>
  <span id="saveStatus" role="status"></span>
</div>
<div class="footer">A little kindness, one day at a time 🧸</div></main>
<script>
"use strict";
const $=id=>document.getElementById(id);
const cheers=["You’ve got this, one little step at a time!","Breathe in, breathe out. I’m cheering for you!","Sending you the biggest little hug!","Look at you go—what a brave heart!","You don’t have to rush. Just keep going!","Today is another tiny win. Yay, you!","I believe in you, always!","One more day closer. We can do this!"];
const animals=["bear","rabbit","cat","dog"];
const todayISO=()=>{const d=new Date();d.setHours(0,0,0,0);return iso(d)};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const dayNum=d=>Math.floor(d.getTime()/86400000);
function safeDate(value){if(!value)return null;const d=new Date(value+"T00:00:00");return Number.isNaN(d.getTime())?null:d}
let targets=[];
try{targets=JSON.parse(localStorage.getItem("littleBearTargets")||"[]");}catch(e){targets=[];}
if(!Array.isArray(targets))targets=[];
if(!targets.length){
 const old=safeDate(localStorage.getItem("littleBearTarget"));
 const d=old||new Date();if(!old)d.setDate(d.getDate()+29);
 targets=[{id:Date.now(),name:"",date:iso(d)}];
}
targets=targets.filter(t=>t&&safeDate(t.date)).map((t,i)=>({id:t.id||Date.now()+i,name:String(t.name||""),date:t.date}));
if(!targets.length){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+29);targets=[{id:Date.now(),name:"",date:iso(d)}];}
let start=safeDate(localStorage.getItem("littleBearStart"));
if(!start){start=safeDate(todayISO());localStorage.setItem("littleBearStart",iso(start));}
function upcoming(){const today=todayISO();return targets.filter(t=>t.date>=today).sort((a,b)=>a.date.localeCompare(b.date))[0]||targets.slice().sort((a,b)=>a.date.localeCompare(b.date))[0];}
function renderTargetRows(){
 const box=$("targetRows");box.replaceChildren();
 targets.forEach((t,i)=>{
  const row=document.createElement("div");row.className="target-row";
  const name=document.createElement("input");name.type="text";name.maxLength=70;name.placeholder="What is it for?";name.value=t.name;name.setAttribute("aria-label","Event name");
  name.addEventListener("input",()=>t.name=name.value);
  const date=document.createElement("input");date.type="date";date.value=t.date;date.setAttribute("aria-label","Target date");
  date.addEventListener("change",()=>t.date=date.value);
  const remove=document.createElement("button");remove.type="button";remove.textContent="×";remove.title="Remove date";remove.setAttribute("aria-label","Remove date");
  remove.addEventListener("click",()=>{if(targets.length>1){targets.splice(i,1);renderTargetRows();}else{$("saveStatus").textContent="Keep at least one countdown date."; }});
  row.append(name,date,remove);box.appendChild(row);
 });
}
let cheerIndex=0,animalIndex=0;
function face(type){
 const p={bear:{fur:"#f3d9a7",muzzle:"#f9e8c6",inner:"#a8c5d2",nose:"#332923"},rabbit:{fur:"#d5d7d8",muzzle:"#f4eeee",inner:"#efb9c3",nose:"#d88f9e"},cat:{fur:"#f4c7a0",muzzle:"#fff0df",inner:"#e9a6ad",nose:"#d88998"},dog:{fur:"#d6a77c",muzzle:"#f8e3c8",inner:"#bd8760",nose:"#382b27"}}[type];
 let ears="";
 if(type==="bear")ears=`<g class="ear-left"><circle cx="70" cy="72" r="39" fill="${p.fur}" stroke="#29231f" stroke-width="5"/><circle cx="70" cy="72" r="21" fill="${p.inner}" stroke="#29231f" stroke-width="3"/></g><g class="ear-right"><circle cx="190" cy="72" r="39" fill="${p.fur}" stroke="#29231f" stroke-width="5"/><circle cx="190" cy="72" r="21" fill="${p.inner}" stroke="#29231f" stroke-width="3"/></g>`;
 if(type==="rabbit")ears=`<g class="ear-left"><ellipse cx="88" cy="48" rx="25" ry="59" transform="rotate(-15 88 48)" fill="${p.fur}" stroke="#29231f" stroke-width="5"/><ellipse cx="88" cy="48" rx="12" ry="42" transform="rotate(-15 88 48)" fill="${p.inner}"/></g><g class="ear-right"><ellipse cx="172" cy="48" rx="25" ry="59" transform="rotate(15 172 48)" fill="${p.fur}" stroke="#29231f" stroke-width="5"/><ellipse cx="172" cy="48" rx="12" ry="42" transform="rotate(15 172 48)" fill="${p.inner}"/></g>`;
 if(type==="cat")ears=`<g class="ear-left"><path d="M48 105 L52 22 Q56 8 72 25 L111 68Z" fill="${p.fur}" stroke="#29231f" stroke-width="5"/><path d="M65 62 L64 35 L88 65Z" fill="${p.inner}"/></g><g class="ear-right"><path d="M149 68 L188 25 Q204 8 208 22 L212 105Z" fill="${p.fur}" stroke="#29231f" stroke-width="5"/><path d="M172 65 L197 35 L198 62Z" fill="${p.inner}"/></g>`;
 if(type==="dog")ears=`<g class="ear-left"><path d="M66 47 Q25 33 31 92 Q34 131 71 123 L89 69Z" fill="${p.fur}" stroke="#29231f" stroke-width="5"/></g><g class="ear-right"><path d="M194 47 Q235 33 229 92 Q226 131 189 123 L171 69Z" fill="${p.fur}" stroke="#29231f" stroke-width="5"/></g>`;
 let muzzle=type==="cat"?`<path d="M112 151 Q130 142 148 151 Q145 171 130 174 Q115 171 112 151Z" fill="${p.nose}"/><path d="M130 173 V183 M130 183 Q115 195 103 184 M130 183 Q145 195 157 184" fill="none" stroke="#29231f" stroke-width="4" stroke-linecap="round"/>`:`<ellipse cx="130" cy="158" rx="43" ry="31" fill="${p.muzzle}" stroke="#29231f" stroke-width="3.5"/><path d="M117 151 Q130 140 143 151 Q140 163 130 164 Q120 163 117 151Z" fill="${p.nose}" stroke="#29231f" stroke-width="3"/><path d="M130 164 V177 M130 177 Q115 190 101 178 M130 177 Q145 190 159 178" fill="none" stroke="#29231f" stroke-width="4" stroke-linecap="round"/>`;
 return `<g class="head-motion">${ears}<path d="M39 128 Q37 63 91 44 Q130 28 169 44 Q223 63 221 128 Q219 202 130 211 Q41 202 39 128Z" fill="${p.fur}" stroke="#29231f" stroke-width="5"/><ellipse cx="98" cy="121" rx="11" ry="15" fill="#29231f" class="eye"/><ellipse cx="162" cy="121" rx="11" ry="15" fill="#29231f" class="eye"/><circle cx="94" cy="116" r="3.5" class="eye-sparkle"/><circle cx="158" cy="116" r="3.5" class="eye-sparkle"/><ellipse cx="78" cy="151" rx="14" ry="8" fill="#f0a7a9" opacity=".6"/><ellipse cx="182" cy="151" rx="14" ry="8" fill="#f0a7a9" opacity=".6"/>${muzzle}<path d="M102 205 Q130 220 158 205" fill="none" stroke="#29231f" stroke-width="4" stroke-linecap="round"/></g>`;
}
function renderAnimal(){const type=animals[animalIndex%animals.length];$("mascot").innerHTML=face(type);$("mascot").setAttribute("aria-label",`A cute smiling ${type} head`);$("speech").textContent=cheers[cheerIndex%cheers.length];}
function render(){
 const active=upcoming();const target=safeDate(active.date);const now=safeDate(todayISO());
 const total=Math.max(1,Math.round((target-start)/86400000));
 const remaining=Math.max(0,Math.ceil((target-now)/86400000));const passed=Math.max(0,total-remaining);
 $("days").textContent=remaining;$("daysLabel").textContent=remaining===1?"day to go":"days to go";
 $("targetCaption").textContent=active.name?`to ${active.name}`:"";
 $("progressText").textContent=`You’ve made it through ${passed} ${passed===1?"day":"days"}`;$("leftText").textContent=`${remaining} left`;
 const dots=$("dots");dots.replaceChildren();
 for(let i=0;i<total;i++){const el=document.createElement("span");el.className="dot";if(i<passed)el.classList.add("done");else if(i===passed&&remaining>0)el.classList.add("today");el.title=i<passed?`Day ${i+1} completed`:`Day ${i+1} remaining`;dots.appendChild(el);}
}
$("editDate").addEventListener("click",()=>{$("dateSettings").hidden=!$("dateSettings").hidden;$("saveStatus").textContent="";if(!$("dateSettings").hidden)renderTargetRows();});
$("addTarget").addEventListener("click",()=>{const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+30);targets.push({id:Date.now(),name:"",date:iso(d)});renderTargetRows();});
$("saveDate").addEventListener("click",()=>{
 const valid=targets.filter(t=>safeDate(t.date));
 if(!valid.length){$("saveStatus").textContent="Please add at least one valid date.";return;}
 targets=valid;localStorage.setItem("littleBearTargets",JSON.stringify(targets));
 const active=upcoming();localStorage.setItem("littleBearTarget",active.date);localStorage.setItem("littleBearStart",todayISO());start=safeDate(todayISO());
 render();$("saveStatus").textContent="Saved!";
});
$("newLine").addEventListener("click",()=>{cheerIndex=(cheerIndex+1)%cheers.length;animalIndex=(animalIndex+1)%animals.length;renderAnimal();});
render();renderAnimal();
setInterval(()=>{const current=safeDate(todayISO());if(current.getTime()!==start.getTime()&&current.getTime()!==lastRenderedDay){lastRenderedDay=current.getTime();render();}},60000);
let lastRenderedDay=dayNum(safeDate(todayISO()));
</script></body></html>
